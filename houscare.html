const API_BASE = 'https://web-production-2c8f2.up.railway.app';
async function apiFetch(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    method: opts.method || 'GET',
    credentials: 'include', // manda la cookie de sesión (login admin, sin login en portales)
    headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* respuesta vacía, ej. 204 */ }
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

// ─── Chat interno ─────────────────────────────────────────────────────────────
function ChatPanel({ reclamo, autor, onSend }) {
  const [msg, setMsg] = React.useState("");
  const msgs = reclamo?.mensajes || [];
  const send = () => { if (!msg.trim()) return; onSend(reclamo.id, autor, msg.trim()); setMsg(""); };
  const colorAutor = a => a==="Admin"?"#1D44AA":a==="Proveedor"?"#059669":"#EA580C";
  const bgAutor    = a => a==="Admin"?"#EFF6FF":a==="Proveedor"?"#F0FDF4":"#FFF7ED";
  return (
    <div style={{marginBottom:14}}>
      <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8,marginBottom:6}}>💬 Chat ({msgs.length})</div>
      <div style={{background:"#F8FAFC",borderRadius:12,padding:10,marginBottom:8,maxHeight:200,overflowY:"auto"}}>
        {msgs.length===0&&<div style={{color:"#94A3B8",fontSize:12,textAlign:"center",padding:"8px 0"}}>Sin mensajes aún</div>}
        {msgs.map((m,i)=>(
          <div key={i} style={{marginBottom:8,padding:"7px 10px",borderRadius:10,background:bgAutor(m.autor)}}>
            <div style={{fontSize:10,fontWeight:700,color:colorAutor(m.autor),marginBottom:2}}>{m.autor} · {m.fecha}</div>
            <div style={{fontSize:12,color:"#0F1E3C",lineHeight:1.4}}>{m.texto}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8}}>
        <input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Escribí un mensaje..." style={{flex:1,padding:"8px 12px",borderRadius:10,border:"1.5px solid #E2E8F0",fontSize:12,outline:"none",background:"#fff",fontFamily:"inherit"}}/>
        <button onClick={send} style={{background:"#1D44AA",color:"#fff",border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:13,cursor:"pointer"}}>➤</button>
      </div>
    </div>
  );
}

        <label htmlFor={`pf-${r.id}`} style={{flex:1,background:"#F1F5F9",color:"#475569",borderRadius:10,padding:"10px 0",fontWeight:700,fontSize:12,cursor:"pointer",textAlign:"center",display:"block"}}>📷 Subir fotos</label>
        {r.estado !== "Resuelto" && r.estado !== "Pendiente" && r.estado !== "Cerrado" && (
          <button onClick={()=>onTerminado(r.id)} style={{flex:1,background:"#059669",color:"#fff",border:"none",borderRadius:10,padding:"10px 0",fontWeight:700,fontSize:12,cursor:"pointer"}}>✅ Terminado</button>
        )}
        {r.estado === "Resuelto" && !r.cobrado && (
          <button onClick={()=>onCobrado(r.id)} style={{flex:1,background:"#7C3AED",color:"#fff",border:"none",borderRadius:10,padding:"10px 0",fontWeight:700,fontSize:12,cursor:"pointer"}}>💰 Cobrado</button>
        )}
        {r.cobrado && (
          <div style={{flex:1,background:"#F0FDF4",color:"#065F46",border:"1.5px solid #BBF7D0",borderRadius:10,padding:"10px 0",fontWeight:700,fontSize:12,textAlign:"center"}}>✅ Cobrado</div>
        )}
      </div>
    </div>
  );
}

// ─── Toast local para portales sin sesión (inquilino/proveedor/propietario) ──
function usePortalToast() {
  const [toast, setToast] = React.useState(null);
  const show = msg => { setToast(msg); setTimeout(() => setToast(null), 2500); };
  const Toast = toast ? (
    <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#0F1E3C",color:"#fff",padding:"10px 20px",borderRadius:12,fontSize:13,fontWeight:700,zIndex:9999,whiteSpace:"nowrap",boxShadow:"0 4px 16px rgba(0,0,0,.25)"}}>{toast}</div>
  ) : null;
  return [show, Toast];
}
const PH_PORTAL = { background:"#0F1E3C", padding:"14px 16px" };
function PortalHeader({ titulo, sub, fromAdmin, onBack, right }) {

}

// ─── Portal Inquilino — reportar un problema nuevo (sin token, por id de propiedad) ──
function PortalInqNuevo({ pid, fromAdmin, onBack }) {
  const [showToast, Toast] = usePortalToast();
  const [f, setF] = React.useState({ nombre:"", tel:"", email:"", sector:"Plomería", descripcion:"", fotos:[] });
  const [ok, setOk] = React.useState(null); // reclamo creado
  const [busy, setBusy] = React.useState(false);
  const [prop, setProp] = React.useState(null); // datos de la propiedad (sesión 8: mostrar dirección + precargar inquilino)

  React.useEffect(() => {
    apiFetch(`/api/portal/inquilino/propiedad/${pid}`).then(res => {
      setProp(res.propiedad);
      // Precarga si ya había un inquilino cargado en la propiedad -- sigue siendo editable,
      // por si reporta otra persona de la misma dirección.
      setF(fr => ({ ...fr, nombre: res.propiedad.inquilino || fr.nombre, tel: res.propiedad.tel || fr.tel, email: res.propiedad.email || fr.email }));
    }).catch(() => {}); // si falla, el form sigue andando en blanco (no es bloqueante)
  }, [pid]);

  const addFotos = files => {
    Array.from(files).forEach(file => readFile(file, url => {
      setF(fr => ({ ...fr, fotos:[...fr.fotos, { dataUrl:url, nombre:file.name, subidaPor:"Inquilino", fecha:today() }] }));
    }));
  };

  const enviar = async () => {
    if (!f.nombre || !f.descripcion) { alert("Completá nombre y descripción"); return; }
    setBusy(true);
    try {
      const r = await apiFetch(`/api/portal/inquilino/nueva/${pid}`, { method:'POST', body:{ inquilino:f.nombre, telInq:f.tel, email:f.email, sector:f.sector, descripcion:f.descripcion, fotos:f.fotos } });
      setOk(r.reclamo);
    } catch(e) { alert(e.message); } finally { setBusy(false); }
  };

  if (ok) return (
    <div style={{background:"#F0F4F8",minHeight:"100vh"}}>
      {Toast}
      <PortalHeader titulo="Portal Inquilino" sub={ok.propiedad} fromAdmin={fromAdmin} onBack={onBack}/>
      <div style={{padding:32,textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:16}}>✅</div>
        <h2 style={{margin:"0 0 8px",color:"#065F46",fontWeight:900,fontSize:22}}>¡Reclamo enviado!</h2>
        <p style={{color:"#475569",fontSize:14,marginBottom:20}}>Tu reclamo fue registrado. La inmobiliaria se va a contactar pronto.</p>
        <div style={{background:"#D1FAE5",borderRadius:14,padding:20,marginBottom:24}}>
          <div style={{fontSize:12,color:"#065F46",fontWeight:700,textTransform:"uppercase",letterSpacing:.8,marginBottom:6}}>Número de reclamo</div>
          <div style={{fontSize:36,fontWeight:900,color:"#065F46"}}>{ok.id}</div>
        </div>
        <p style={{fontSize:13,color:"#94A3B8",marginBottom:24}}>Guardá este link para hacer seguimiento y chatear con el proveedor.</p>
        <button onClick={() => { window.location.href = `${window.location.pathname}?portal=inq&t=${ok.portalToken}`; }} style={BB_PORTAL}>Ver estado de mi reclamo</button>
        <button onClick={() => setOk(null)} style={{...BG_PORTAL,marginTop:10}}>Reportar otro problema</button>
      </div>
    </div>
  );

  return (
    <div style={{background:"#F0F4F8",minHeight:"100vh"}}>
      {Toast}
      <PortalHeader titulo="Portal Inquilino" sub={prop?.dir} fromAdmin={fromAdmin} onBack={onBack}/>
      <div style={{padding:"16px 16px 60px"}}>
        <div style={{background:"#EFF6FF",borderRadius:12,padding:"12px 14px",marginBottom:14,fontSize:13,color:"#1D44AA",fontWeight:600}}>Reportá un problema en tu propiedad. Te avisamos cuando esté resuelto.</div>
        <div style={CARD_PORTAL}>
          <div style={{marginBottom:14}}><label style={LBL_PORTAL}>Tu nombre *</label><input placeholder="Apellido, Nombre" value={f.nombre} onChange={e=>setF(fr=>({...fr,nombre:e.target.value}))} style={INP_PORTAL}/></div>
          <div style={{marginBottom:14}}><label style={LBL_PORTAL}>Teléfono</label><input type="tel" placeholder="341-000-0000" value={f.tel} onChange={e=>setF(fr=>({...fr,tel:e.target.value}))} style={INP_PORTAL}/></div>
          <div style={{marginBottom:14}}><label style={LBL_PORTAL}>Email</label><input type="email" placeholder="tu@email.com" value={f.email} onChange={e=>setF(fr=>({...fr,email:e.target.value}))} style={INP_PORTAL}/></div>
          <div style={{marginBottom:14}}><label style={LBL_PORTAL}>Tipo de problema</label><select value={f.sector} onChange={e=>setF(fr=>({...fr,sector:e.target.value}))} style={INP_PORTAL}>{SECTORES.map(o=><option key={o}>{o}</option>)}</select></div>
          <div style={{marginBottom:14}}><label style={LBL_PORTAL}>Descripción *</label><textarea placeholder="Describí el problema con el mayor detalle posible..." value={f.descripcion} onChange={e=>setF(fr=>({...fr,descripcion:e.target.value}))} style={{...INP_PORTAL,height:100,resize:"none"}}/></div>
          <div style={{marginBottom:20}}>
            <label style={LBL_PORTAL}>📷 Fotos del problema</label>
            <input type="file" id="inq-file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{addFotos(e.target.files);e.target.value="";}}/>
            <label htmlFor="inq-file" style={{display:"block",background:"#F8FAFC",border:"1.5px dashed #CBD5E1",borderRadius:10,padding:"14px",cursor:"pointer",color:"#64748B",fontWeight:600,fontSize:13,textAlign:"center",boxSizing:"border-box"}}>📷 Agregar fotos</label>
            {f.fotos.length > 0 && (
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:8}}>
                {f.fotos.map((ft,i) => (
                  <div key={i} style={{position:"relative"}}>
                    <img src={ft.dataUrl} alt="" style={{width:"100%",height:80,objectFit:"cover",borderRadius:8,border:"1.5px solid #E2E8F0"}}/>
                    <button onClick={()=>setF(fr=>({...fr,fotos:fr.fotos.filter((_,j)=>j!==i)}))} style={{position:"absolute",top:3,right:3,background:"rgba(0,0,0,.65)",color:"#fff",border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",fontSize:12}}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div style={{fontSize:12,color:"#64748B",textAlign:"center",marginBottom:10}}>📍 Podés seguir el proceso de tu reclamo desde este mismo link, una vez enviado.</div>
          <button onClick={enviar} disabled={busy} style={{...BB_PORTAL,opacity:busy?.7:1}}>{busy?"Enviando…":"Enviar reclamo"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── Portal Inquilino — ver/seguir UN reclamo por portalToken ────────────────
function PortalInqToken({ token, fromAdmin, onBack }) {
  const [showToast, Toast] = usePortalToast();
  const [r, setR] = React.useState(null);
  const [err, setErr] = React.useState(null);

  React.useEffect(() => {
    apiFetch(`/api/portal/inquilino/${token}`).then(res=>setR(res.reclamo)).catch(e=>setErr(e.message));
  }, [token]);

  const onMsg = async (_id, _autor, texto) => {
    try {
      const res = await apiFetch(`/api/portal/inquilino/${token}/mensajes`, { method:'POST', body:{ texto } });
      setR(res.reclamo);
    } catch(e) { showToast("⚠️ " + e.message); }
  };
  const onRating = async (_id, rating, comentario) => {
    try {
      const res = await apiFetch(`/api/portal/inquilino/${token}/rating`, { method:'POST', body:{ rating, comentario } });
      setR(res.reclamo);
      showToast("⭐ Gracias por tu calificación");
    } catch(e) { showToast("⚠️ " + e.message); }
  };

  if (err) return <PortalError msg={err}/>;
  if (!r) return <PortalLoading/>;
  return (
    <div style={{background:"#F0F4F8",minHeight:"100vh"}}>
      {Toast}
      <PortalHeader titulo="Portal Inquilino" sub={r.propiedad} fromAdmin={fromAdmin} onBack={onBack}/>
      <div style={{padding:"12px 16px 60px"}}>
        <InqReclamoCard r={r} onRating={onRating} onMsg={onMsg}/>
      </div>
    </div>
  );
}

// ─── Portal Proveedor — ver/gestionar UN trabajo por portalToken ─────────────
function PortalProvToken({ token, fromAdmin, onBack }) {
  const [showToast, Toast] = usePortalToast();
  const [r, setR] = React.useState(null);
  const [err, setErr] = React.useState(null);

  React.useEffect(() => {
    apiFetch(`/api/portal/proveedor/${token}`).then(res=>setR(res.reclamo)).catch(e=>setErr(e.message));
  }, [token]);

  const accion = async (path, body, msgOk) => {
    try {
      const res = await apiFetch(`/api/portal/proveedor/${token}${path}`, { method:'POST', body });
      setR(res.reclamo);
      if (msgOk) showToast(msgOk);
    } catch(e) { showToast("⚠️ " + e.message); }
  };
  const onMsg = (_id, _autor, texto) => accion('/mensajes', { texto });
  const onPresupuesto = (_id, val) => accion('/presupuesto', { costoEst: val });
  const onFotos = async (_id, _por, files) => {
    for (const file of Array.from(files)) {
      try {
        const fd = new FormData(); fd.append('foto', file);
        const res = await fetch(`${API_BASE}/api/portal/proveedor/${token}/fotos`, { method:'POST', body:fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
        setR(data.reclamo);
        showToast("📷 Foto subida");
      } catch(e) { showToast("⚠️ " + e.message); }
    }
  };

  if (err) return <PortalError msg={err}/>;
  if (!r) return <PortalLoading/>;
  return (
    <div style={{background:"#F0F4F8",minHeight:"100vh"}}>
      {Toast}
      <PortalHeader titulo="Portal Proveedor" sub={r.proveedor} fromAdmin={fromAdmin} onBack={onBack}
        right={<button onClick={()=>window.scrollTo({top:0,behavior:"smooth"})} style={{background:"rgba(255,255,255,.15)",color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontWeight:600,fontSize:11,cursor:"pointer"}}>📋 Detalle</button>}/>
      <div style={{padding:"12px 16px 60px"}}>
        <ProvJobCard r={r}
          onAccept={()=>accion('/aceptar', {}, "✅ Trabajo aceptado")}
          onReject={()=>accion('/rechazar', {}, "❌ Trabajo rechazado")}
          onTerminado={()=>accion('/terminado', {}, "✅ Marcado como terminado")}
          onCobrado={()=>accion('/cobrado', {}, "💰 ¡Cobro registrado!")}
          onMsg={onMsg}
          onFotos={onFotos}
          onPresupuesto={onPresupuesto}
          showFn={showToast}
        />
      </div>
    </div>
  );
}

      <div style={{padding:"12px 16px 60px"}}>
        <div style={CARD_PORTAL}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:800,fontSize:15,color:"#0F1E3C"}}>{proveedor.nombre}</div>
              <div style={{fontSize:12,color:"#64748B"}}>{proveedor.rubro}{proveedor.zona?" · 📍 "+proveedor.zona:""}</div>
            </div>
            <Stars n={proveedor.cal||5}/>

        <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8,margin:"16px 0 8px"}}>Trabajos activos ({activos.length})</div>

        )}
      </div>
    </div>
  );
}

                <button onClick={()=>aprobar("rechazada")} style={{flex:1,background:"#EF4444",color:"#fff",border:"none",borderRadius:10,padding:"11px 0",fontWeight:700,fontSize:13,cursor:"pointer"}}>❌ Rechazar</button>
              </div>
            </div>
          )}
          {r.aprobacion === "aprobada"  && <div style={{background:"#D1FAE5",borderRadius:10,padding:"8px 12px",textAlign:"center",fontSize:13,color:"#065F46",fontWeight:700}}>✅ Aprobado — reparación autorizada</div>}
          {r.aprobacion === "rechazada" && <div style={{background:"#FEE2E2",borderRadius:10,padding:"8px 12px",textAlign:"center",fontSize:13,color:"#991B1B",fontWeight:700}}>❌ Rechazado — se notificó a la inmobiliaria</div>}
        </div>
      </div>
    </div>
  );
}

// ─── Portal Propietario — vista "home": TODAS sus propiedades y reclamos ─────
// (sesión 8, 11/08/2026). Link fijo por propietario (portal_token en la
// tabla propietarios) -- un propietario puede tener más de una propiedad.
// Cada reclamo de la lista lleva al detalle puntual (PortalOwnToken de
// arriba), donde está la acción de aprobar/rechazar presupuesto.
function PortalOwnHome({ token, fromAdmin, onBack }) {
  const [data, setData] = React.useState(null);
  const [err,  setErr]  = React.useState(null);
  const [verHistorial, setVerHistorial] = React.useState(false);

  React.useEffect(() => {
    apiFetch(`/api/portal/propietario/home/${token}`).then(setData).catch(e=>setErr(e.message));
  }, [token]);

  if (err) return <PortalError msg={err}/>;
  if (!data) return <PortalLoading/>;
  const { propietario, propiedades, activos, historial } = data;

  const ClaimRow = ({ r }) => (
    <a href={`${window.location.pathname}?portal=own&t=${r.portalToken}`} style={{textDecoration:"none",display:"block"}}>
      <div style={CARD_PORTAL}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:11,fontWeight:800,color:"#1D44AA",background:"#EFF6FF",padding:"2px 8px",borderRadius:6}}>{r.id}</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {r.aprobacion==="pendiente"&&<span style={{fontSize:10,background:"#FEF3C7",color:"#92400E",fontWeight:700,padding:"2px 8px",borderRadius:8}}>⏳ pendiente</span>}
            <Badge label={r.estado} sm/>
          </div>
        </div>
        <div style={{fontWeight:700,fontSize:14,color:"#0F1E3C",marginBottom:2}}>{r.propiedad}</div>
        <div style={{fontSize:12,color:"#64748B"}}>{r.sector} · {fmtDate(r.fecha)}</div>
      </div>
    </a>
  );

  return (
    <div style={{background:"#F0F4F8",minHeight:"100vh"}}>
      <PortalHeader titulo="Portal Propietario" sub={propietario.nombre} fromAdmin={fromAdmin} onBack={onBack}/>
      <div style={{padding:"12px 16px 60px"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8,marginBottom:8}}>Tus propiedades ({propiedades.length})</div>
        {propiedades.length===0 && <div style={{textAlign:"center",padding:"16px 0",color:"#94A3B8",fontSize:13}}>Todavía no tenés propiedades cargadas.</div>}
        {propiedades.map(p => (
          <div key={p.id} style={{...CARD_PORTAL,padding:"10px 14px"}}>
            <div style={{fontWeight:700,fontSize:13,color:"#0F1E3C"}}>{p.dir}</div>
            {p.inquilino && <div style={{fontSize:11,color:"#64748B"}}>👤 {p.inquilino}</div>}
          </div>
        ))}

        <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8,margin:"16px 0 8px"}}>Reclamos activos ({activos.length})</div>
        {activos.length===0 && <div style={{textAlign:"center",padding:"24px 0",color:"#94A3B8",fontSize:13}}>No hay reclamos activos en tus propiedades.</div>}
        {activos.map(r => <ClaimRow key={r.id} r={r}/>)}

        <button onClick={()=>setVerHistorial(v=>!v)} style={{...BG_PORTAL,marginTop:16}}>{verHistorial?"Ocultar":"Ver"} historial ({historial.length})</button>
        {verHistorial && (
          <div style={{marginTop:10}}>
            {historial.length===0 && <div style={{textAlign:"center",padding:"24px 0",color:"#94A3B8",fontSize:13}}>Todavía no hay reclamos cerrados.</div>}
            {historial.map(r => <ClaimRow key={r.id} r={r}/>)}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── App principal ────────────────────────────────────────────────────────────
function App() {
  // ── Estado ──
  const [tab,        setTab]        = useState("inicio");
  const [reclamos,   setReclamos]   = useState([]);
  const [proveedores, setProveedores] = useState(PROVEEDORES_INIT);
  const [loading,    setLoading]    = useState(true);
  const [showForm,   setShowForm]   = useState(false);
  const [form,       setForm]       = useState(EF);
  const [editId,     setEditId]     = useState(null);
  const [detId,      setDetId]      = useState(null);
  const [busqueda,   setBusqueda]   = useState("");
  const [fEst,       setFEst]       = useState("Todos");
  const [fPrio,      setFPrio]      = useState("Todos");
  const [showFil,    setShowFil]    = useState(false);
  const [portal,     setPortal]     = useState(() => {
    // Esquema por portal_token (09/08/2026, sesión 5): cada link de
    // inquilino/proveedor/propietario apunta a UN reclamo puntual, vía el
    // parámetro `t`. El único caso sin token es "reportar un problema
    // nuevo" del inquilino, identificado por `pid` (id de propiedad) —
    // ver POST /api/portal/inquilino/nueva/<pid> en el backend.
    const p = new URLSearchParams(window.location.search);
    const type = p.get('portal');
    const token = p.get('t');
    const pid = p.get('pid');
    if (type==='inq'  && token) return { type:'inq',  token };
    if (type==='inq'  && pid)   return { type:'inq-nuevo', pid };
    if (type==='prov' && token) return { type:'prov', token };
    if (type==='own'  && token) return { type:'own',  token };
    // Vistas "home" agregadas (sesión 8, 11/08/2026) — link fijo por
    // proveedor/propietario, no por reclamo puntual (ver PortalProvHome/PortalOwnHome).
    if (type==='provh' && token) return { type:'provh', token };
    if (type==='ownh'  && token) return { type:'ownh',  token };
    return null;
  });
  const [showProvForm,setShowProvForm] = useState(false);
  const [provForm,    setProvForm]    = useState(EPROVF);
  const [propiedades, setPropiedades] = useState([]);
  const [propietarios,setPropietarios]= useState([]);
  const [showPropForm,setShowPropForm]= useState(false);
  const [propForm,    setPropForm]    = useState(EPROPF);
  const [editPropId,  setEditPropId]  = useState(null);
  const [showOwnerForm,setShowOwnerForm]=useState(false);
  const [ownerForm,   setOwnerForm]   = useState(EOWNF);
  const [editOwnerId, setEditOwnerId] = useState(null);
  const [propTab,     setPropTab]     = useState("props");
  const [propBusq,    setPropBusq]    = useState("");
  const [ratingComent,setRatingComent]= useState("");
  const [provTab,     setProvTab]     = useState("todos");
  const [toast,      setToast]      = useState(null);
  const [portalBusq, setPortalBusq] = useState("");
  const [ratingModal,setRatingModal]= useState(null); // {id, provNombre, provId, val}
  // ── Auth admin (API REST — no aplica a los portales, que siguen sin login) ──
  const [usuario,    setUsuario]    = useState(null);
  const [loginForm,  setLoginForm]  = useState({ email:"", password:"" });
  const [loginErr,   setLoginErr]   = useState("");
  const [loginBusy,  setLoginBusy]  = useState(false);
  // Registro de cuenta nueva (sesión 8, 11/08/2026) — abierto para cualquiera
  // que tenga la URL, sin filtro de plan/invitación por ahora.
  const [showRegister,  setShowRegister]  = useState(false);
  const [registerForm,  setRegisterForm]  = useState({ org_nombre:"", nombre:"", email:"", password:"" });
  const [registerErr,   setRegisterErr]   = useState("");
  const [registerBusy,  setRegisterBusy]  = useState(false);
  // Cambio de contraseña estando logueado (sesión 8) — "olvidé mi contraseña"
  // sin sesión queda pendiente para cuando se arme el envío de emails (Fase 3).
  const [showChangePass, setShowChangePass] = useState(false);
  const [changePassForm, setChangePassForm] = useState({ actual:"", nueva:"", nueva2:"" });
  const [changePassErr,  setChangePassErr]  = useState("");
  const [changePassBusy, setChangePassBusy] = useState(false);

  // ── Carga de datos del admin vía API REST (Fase 2) ──
  // Sin auto-seed: si la org está recién creada en Postgres, arranca vacía
  // (a diferencia del Supabase de abajo, que sembraba PROPS_DATA/OWNERS/
  // PROVEEDORES_INIT si la tabla estaba vacía). La migración de los datos
  // reales queda para Fase 5 (ver PROYECTO.md).
  const loadAdminData = async () => {
    const [propsRes, ownRes, provRes, recRes] = await Promise.all([
      apiFetch('/api/propiedades'),
      apiFetch('/api/propietarios'),
      apiFetch('/api/proveedores'),
      apiFetch('/api/reclamos'),
    ]);
    setPropiedades(propsRes.propiedades);
    setPropietarios(ownRes.propietarios);
    setProveedores(provRes.proveedores);
    setReclamos(recRes.reclamos);
  };

  // ── Carga inicial ──
  // Portales externos (inquilino/proveedor/propietario, vía URL ?portal=...):
  // desde la sesión 5 (portal_token) cada uno se auto-carga con su propio
  // GET /api/portal/<tipo>/<token> — no dependen del estado global del admin,
  // así que acá no hay nada que hacer para ellos (ver componentes
  // PortalInqToken / PortalInqNuevo / PortalProvToken / PortalOwnToken).
  // Admin (sin portal en la URL): va por la API REST, atrás de login.
  useEffect(() => {
    if (portal) {
      setLoading(false);
    } else {
      (async () => {
        try {
          const me = await apiFetch('/api/auth/me');
          setUsuario(me.usuario);
          await loadAdminData();
        } catch (e) {
          // 401 — no hay sesión activa, se muestra la pantalla de login
        } finally {
          setLoading(false);
        }
      })();
    }
  }, []);

  const showToast = msg => { setToast(msg); setTimeout(() => setToast(null), 2500); };

  // refresh(): sólo se usa en el header del admin (los portales no lo muestran) → vía API.
  const refresh = async () => {
    showToast("🔄 Actualizando…");
    try {
      await loadAdminData();
      showToast("✅ Datos actualizados");
    } catch (e) {
      showToast("⚠️ No se pudo actualizar: " + e.message);
    }
  };

  // ── Auth admin ──
  const doLogin = async () => {
    if (!loginForm.email || !loginForm.password) { setLoginErr("Completá email y contraseña"); return; }
    setLoginBusy(true); setLoginErr("");
    try {
      const r = await apiFetch('/api/auth/login', { method:'POST', body:{ email:loginForm.email, password:loginForm.password } });
      setUsuario(r.usuario);
      setLoginForm({ email:"", password:"" });
      setLoading(true);
      await loadAdminData();
      setLoading(false);
    } catch (e) {
      setLoginErr(e.message || "No se pudo iniciar sesión");
    } finally {
      setLoginBusy(false);
    }
  };
  const doLogout = async () => {
    try { await apiFetch('/api/auth/logout', { method:'POST' }); } catch (e) {}
    setUsuario(null);
    setReclamos([]); setPropiedades([]); setPropietarios([]); setProveedores(PROVEEDORES_INIT);
  };

  const doRegistro = async () => {
    const { org_nombre, nombre, email, password } = registerForm;
    if (!org_nombre || !nombre || !email || !password) { setRegisterErr("Completá todos los campos"); return; }
    if (password.length < 8) { setRegisterErr("La contraseña debe tener al menos 8 caracteres"); return; }
    setRegisterBusy(true); setRegisterErr("");
    try {
      const r = await apiFetch('/api/auth/registro', { method:'POST', body:{ org_nombre, nombre, email, password } });
      setUsuario(r.usuario);
      setShowRegister(false);
      setRegisterForm({ org_nombre:"", nombre:"", email:"", password:"" });
      setLoading(true);
      await loadAdminData();
      setLoading(false);
    } catch (e) {
      setRegisterErr(e.message || "No se pudo crear la cuenta");
    } finally {
      setRegisterBusy(false);
    }
  };

  const doCambiarPassword = async () => {
    const { actual, nueva, nueva2 } = changePassForm;
    if (!actual || !nueva || !nueva2) { setChangePassErr("Completá todos los campos"); return; }
    if (nueva.length < 8) { setChangePassErr("La contraseña nueva debe tener al menos 8 caracteres"); return; }
    if (nueva !== nueva2) { setChangePassErr("Las contraseñas nuevas no coinciden"); return; }
    setChangePassBusy(true); setChangePassErr("");
    try {
      await apiFetch('/api/auth/cambiar-password', { method:'POST', body:{ password_actual:actual, password_nueva:nueva } });
      setShowChangePass(false);
      setChangePassForm({ actual:"", nueva:"", nueva2:"" });
      showToast("🔑 Contraseña actualizada");
    } catch (e) {
      setChangePassErr(e.message || "No se pudo cambiar la contraseña");
    } finally {
      setChangePassBusy(false);
    }
  };

  // ── Links directos a portales ──
  const BASE_URL = window.location.origin + window.location.pathname;
  const portalLink = (params) => BASE_URL + '?' + new URLSearchParams(params).toString();
  const copyLink = (url) => { navigator.clipboard.writeText(url).then(()=>showToast("🔗 Link copiado")); };
  const waLink = (url, nombre) => `https://wa.me/?text=${encodeURIComponent(`Houscare — Tu portal de acceso, ${nombre}:\n${url}`)}`;

  // ── Calificación de proveedor (sólo admin, vía API) ──
  const updateProvCal = async (provNombre, rating) => {
    const allRatings = reclamos
      .filter(r => r.proveedor === provNombre && r.ratingAdmin)
      .map(r => r.ratingAdmin);
    allRatings.push(rating);
    const avg = Math.round((allRatings.reduce((s,v)=>s+v,0)/allRatings.length)*10)/10;
    const prov = proveedores.find(p => p.nombre === provNombre);
    if (!prov) return;
    try {
      const r = await apiFetch(`/api/proveedores/${prov.id}`, { method:'PUT', body:{ cal:avg } });
      setProveedores(ps => ps.map(p => p.id === prov.id ? r.proveedor : p));
    } catch(e) { showToast("⚠️ No se pudo guardar la calificación: " + e.message); }
  };

  // ── Stats ──
  const st = useMemo(() => {
    const ab = reclamos.filter(r => r.estado !== "Cerrado");
    return {
      total:  reclamos.length,
      pend:   reclamos.filter(r => r.estado === "Pendiente").length,
      proc:   reclamos.filter(r => r.estado === "En proceso").length,
      alta:   ab.filter(r => r.prioridad === "Alta").length,
      atras:  ab.filter(r => daysDiff(r.ultimaAct) >= 7).length,
      cerr:   reclamos.filter(r => r.estado === "Cerrado").length,
      costo:  reclamos.reduce((s,r) => s + (Number(r.costoReal) || Number(r.costoEst) || 0), 0),
      altas:  ab.filter(r => r.prioridad === "Alta"),
      stale:  ab.filter(r => daysDiff(r.ultimaAct) >= 7),
      aprob:  ab.filter(r => r.aprobacion === "pendiente").length,
    };
  }, [reclamos]);

  const fils = useMemo(() => reclamos.filter(r => {
    if (fEst  !== "Todos" && r.estado    !== fEst)  return false;
    if (fPrio !== "Todos" && r.prioridad !== fPrio) return false;
    const q = busqueda.toLowerCase();
    if (q && !`${r.id} ${r.propiedad} ${r.inquilino} ${r.descripcion}`.toLowerCase().includes(q)) return false;
    return true;
  }), [reclamos, fEst, fPrio, busqueda]);

  const sortedProps = React.useMemo(()=>[...propiedades].sort((a,b)=>a.dir.localeCompare(b.dir,"es")), [propiedades]);

  // ── Helpers de datos ──
  const nextId = () => {
    const nums = reclamos.map(r => parseInt(r.id.split("-")[1]));
    return `RC-${String(Math.max(...nums, 0) + 1).padStart(3,"0")}`;
  };
  const nextProvId = () => { const nums = proveedores.map(p=>parseInt(p.id.replace(/\D/g,""))||0); return "PR"+String(Math.max(...nums,0)+1).padStart(3,"0"); };
  const nextPropId = () => { const nums = propiedades.map(p=>parseInt(p.id.replace(/\D/g,""))||0); return "P"+String(Math.max(...nums,0)+1).padStart(3,"0"); };
  const nextOwnId  = () => { const nums = propietarios.map(o=>parseInt(o.id.replace(/\D/g,""))||0); return "OW"+String(Math.max(...nums,0)+1).padStart(3,"0"); };

  const addProv = async () => {
    if(!provForm.nombre||!provForm.rubro){alert("Nombre y especialidad son obligatorios");return;}
    try {
      const r = await apiFetch('/api/proveedores', { method:'POST', body: provForm });
      setProveedores(ps=>[...ps, r.proveedor]);
      setProvForm(EPROVF); setShowProvForm(false); showToast("✅ Proveedor agregado");
    } catch(e) { alert(e.message); }
  };
  const deleteProv = async (id) => {
    if(!confirm("¿Eliminar proveedor? Esta acción no se puede deshacer.")) return;
    try {
      await apiFetch(`/api/proveedores/${id}`, { method:'DELETE' });
      setProveedores(ps=>ps.filter(p=>p.id!==id));
      showToast("🗑 Proveedor eliminado");
    } catch(e) { showToast("⚠️ " + e.message); }
  };

  // sendMsgAdmin: versión para el chat del admin (modal de detalle) — vía API, con login.
  const sendMsgAdmin = async (recId, autor, texto) => {
    try {
      const r = await apiFetch(`/api/reclamos/${recId}/mensajes`, { method:'POST', body:{ autor, texto } });
      setReclamos(p => p.map(x => x.id === recId ? r.reclamo : x));
    } catch(e) { showToast("⚠️ " + e.message); }
  };

  // Propiedades CRUD
  const saveProp = async () => {
    if(!propForm.dir){alert("La dirección es obligatoria");return;}
    try {
      if(editPropId) {
        const r = await apiFetch(`/api/propiedades/${editPropId}`, { method:'PUT', body: propForm });
        setPropiedades(ps=>ps.map(p=>p.id===editPropId?r.propiedad:p));
        showToast("✅ Propiedad actualizada");
      } else {
        const r = await apiFetch('/api/propiedades', { method:'POST', body: propForm });
        setPropiedades(ps=>[...ps, r.propiedad]);
        showToast("✅ Propiedad agregada");
      }
      setShowPropForm(false); setPropForm(EPROPF); setEditPropId(null);
    } catch(e) { alert(e.message); }
  };
  const deleteProp = async (id) => {
    if(!confirm("¿Eliminar propiedad? Los reclamos asociados quedarán sin propiedad.")) return;
    try {
      await apiFetch(`/api/propiedades/${id}`, { method:'DELETE' });
      setPropiedades(ps=>ps.filter(p=>p.id!==id));
      showToast("🗑 Propiedad eliminada");
    } catch(e) { showToast("⚠️ " + e.message); }
  };
  const desocuparProp = async (id) => {
    if(!confirm("¿Marcar como desocupada? Se eliminarán los datos del inquilino.")) return;
    try {
      const r = await apiFetch(`/api/propiedades/${id}/desocupar`, { method:'POST' });
      setPropiedades(ps=>ps.map(p=>p.id===id?r.propiedad:p));
      showToast("🏠 Propiedad marcada como vacía");
    } catch(e) { showToast("⚠️ " + e.message); }
  };

  // Propietarios CRUD
  const saveOwner = async () => {
    if(!ownerForm.nombre){alert("El nombre es obligatorio");return;}
    try {
      if(editOwnerId) {
        const r = await apiFetch(`/api/propietarios/${editOwnerId}`, { method:'PUT', body: ownerForm });
        setPropietarios(ps=>ps.map(o=>o.id===editOwnerId?r.propietario:o));
        showToast("✅ Propietario actualizado");
      } else {
        const r = await apiFetch('/api/propietarios', { method:'POST', body: ownerForm });
        setPropietarios(ps=>[...ps, r.propietario]);
        showToast("✅ Propietario agregado");
      }
      setShowOwnerForm(false); setOwnerForm(EOWNF); setEditOwnerId(null);
    } catch(e) { alert(e.message); }
  };
  const deleteOwner = async (id) => {
    if(!confirm("¿Eliminar propietario?")) return;
    try {
      await apiFetch(`/api/propietarios/${id}`, { method:'DELETE' });
      setPropietarios(ps=>ps.filter(o=>o.id!==id));
      showToast("🗑 Propietario eliminado");
    } catch(e) { showToast("⚠️ " + e.message); }
  };
  const pSum = f => Number(f.pctInq) + Number(f.pctProp) + Number(f.pctInmob);
  // addFotosAdmin: versión para el modal de detalle del admin — vía API, con login.
  // Sigue guardando la foto como dataURL (base64) en el JSONB `fotos`, igual que
  // hoy en Supabase — todavía no hay bucket S3 configurado en Railway para subir
  // el archivo real (ver PROYECTO.md, backend/README.md), así que se pospone.
  const addFotosAdmin = (id, por, files) => {
    Array.from(files).forEach(file => readFile(file, url => {
      const newFoto = { dataUrl:url, nombre:file.name, subidaPor:por, fecha:today() };
      setReclamos(p => {
        const updated = p.map(r => r.id === id
          ? { ...r, ultimaAct:today(), fotos:[...(r.fotos||[]), newFoto] }
          : r);
        const updR = updated.find(r => r.id === id);
        if (updR) apiFetch(`/api/reclamos/${id}`, { method:'PUT', body:{ fotos:updR.fotos } })
          .catch(e => showToast("⚠️ No se pudo guardar la foto: " + e.message));
        return updated;
      });
    }));
  };
  const addFotosF = (setter, por, files) => {
    Array.from(files).forEach(file => readFile(file, url => {
      setter(f => ({ ...f, fotos:[...f.fotos, { dataUrl:url, nombre:file.name, subidaPor:por, fecha:today() }] }));
    }));
  };

  // ── Handlers CRUD (admin — vía API) ──
  const submit = async () => {
    if (!form.propiedad || !form.inquilino || !form.descripcion) { alert("Completá los campos obligatorios (*)"); return; }
    if (form.quienPaga === "Por Porcentaje" && pSum(form) !== 100) { alert(`Los porcentajes deben sumar 100%. Ahora suman ${pSum(form)}%.`); return; }
    const base = { ...form, costoEst:Number(form.costoEst)||0, costoReal:Number(form.costoReal)||0, pctInq:Number(form.pctInq)||0, pctProp:Number(form.pctProp)||0, pctInmob:Number(form.pctInmob)||0 };
    let provNuevo = null, tokenNuevo = null;
    try {
      if (editId) {
        const orig = reclamos.find(r => r.id === editId);
        const provCambio = base.proveedor && base.proveedor !== orig?.proveedor;
        const r = await apiFetch(`/api/reclamos/${editId}`, { method:'PUT', body: base });
        setReclamos(p => p.map(x => x.id === editId ? r.reclamo : x));
        if (provCambio) { provNuevo = base.proveedor; tokenNuevo = r.reclamo.portalToken; }
        setEditId(null); showToast("✅ Reclamo actualizado");
      } else {
        const r = await apiFetch('/api/reclamos', { method:'POST', body: base });
        setReclamos(p => [r.reclamo, ...p]);
        if (base.proveedor) { provNuevo = base.proveedor; tokenNuevo = r.reclamo.portalToken; }
        showToast("✅ Reclamo creado");
      }
      setForm(EF); setShowForm(false);
      // WhatsApp automático al asignar proveedor — el link usa el portalToken
      // que devuelve la API (uno por reclamo, ver PROYECTO.md "sesión 5").
      if (provNuevo) {
        const prov = proveedores.find(p => p.nombre === provNuevo);
        if (prov?.tel && tokenNuevo) {
          const link = portalLink({portal:'prov', t:tokenNuevo});
          const waMsg = `Houscare — Hola ${prov.nombre}, tenés un trabajo asignado. Por favor revisá el detalle y confirmá si podés tomarlo:\n${link}`;
          setTimeout(() => window.open(`https://wa.me/${prov.tel.replace(/\D/g,"")}?text=${encodeURIComponent(waMsg)}`, '_blank'), 400);
        }
      }
    } catch(e) { alert(e.message); }
  };
  const cerrar = async (id, rating=null, comentario='') => {
    const rec = reclamos.find(r => r.id === id);
    if (rec?.proveedor && rating === null) {
      setRatingModal({ id, provNombre: rec.proveedor, provId: proveedores.find(p=>p.nombre===rec.proveedor)?.id, val: 0 });
      setRatingComent('');
      return;
    }
    try {
      const r = await apiFetch(`/api/reclamos/${id}`, { method:'PUT', body:{ estado:'Cerrado', comentarioCierre: comentario||'' } });
      setReclamos(p => p.map(x => x.id === id ? r.reclamo : x));
      if (rating && rec?.proveedor) await updateProvCal(rec.proveedor, rating);
      setDetId(null); setRatingModal(null); setRatingComent(''); showToast("✅ Reclamo cerrado");
    } catch(e) { alert(e.message); }
  };
  // solAprob: admin, vía API.
  const solAprob = async id => {
    try {
      const r = await apiFetch(`/api/reclamos/${id}/solicitar-aprobacion`, { method:'POST' });

  };
  const abrirEdit = r => {
    setDetId(null);
    setForm({ propiedad:r.propiedad, inquilino:r.inquilino, email:r.email||"", telInq:r.telInq||"", sector:r.sector, prioridad:r.prioridad, estado:r.estado, proveedor:r.proveedor||"", costoEst:r.costoEst||"", costoReal:r.costoReal||"", quienPaga:r.quienPaga, pctInq:r.pctInq||34, pctProp:r.pctProp||33, pctInmob:r.pctInmob||33, descripcion:r.descripcion, notas:r.notas, fotos:r.fotos||[] });
    setEditId(r.id); setShowForm(true);
  };
  const exportCSV = () => {
    const cols = ["ID","Fecha","Propiedad","Inquilino","Email","Sector","Prioridad","Estado","Proveedor","CostoEst","CostoReal","QuienPaga","PctInq","PctProp","PctInmob","Descripcion","Notas","Aprobacion"];
    const rows = reclamos.map(r => [r.id,r.fecha,r.propiedad,r.inquilino,r.email||"",r.sector,r.prioridad,r.estado,r.proveedor||"",r.costoEst,r.costoReal,r.quienPaga,r.pctInq,r.pctProp,r.pctInmob,`"${r.descripcion}"`,`"${r.notas||""}"`,r.aprobacion||""].join(","));
    const csv  = [cols.join(","), ...rows].join("\n");
    const blob = new Blob(["﻿"+csv], { type:"text/csv;charset=utf-8;" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `houscare_${today()}.csv`; a.click();
    showToast("📊 CSV exportado");
  };

  const det = reclamos.find(r => r.id === detId);

  // ── Estilos comunes ──
  const INP = { width:"100%", padding:"10px 12px", borderRadius:10, border:"1.5px solid #E2E8F0", fontSize:13, outline:"none", boxSizing:"border-box", background:"#F8FAFC", color:"#0F1E3C", fontFamily:"inherit" };
  const LBL = { fontSize:11, fontWeight:700, color:"#64748B", marginBottom:4, display:"block", letterSpacing:.8, textTransform:"uppercase" };
  const BB  = { background:"#1D44AA", color:"#fff", border:"none", borderRadius:12, padding:"13px 0", fontWeight:700, fontSize:15, cursor:"pointer", width:"100%" };
  const BG  = { background:"#F1F5F9", color:"#475569", border:"none", borderRadius:12, padding:"12px 0", fontWeight:600, fontSize:14, cursor:"pointer", width:"100%" };
  const CARD = { background:"#fff", borderRadius:14, padding:"14px 16px", boxShadow:"0 1px 6px rgba(0,0,0,.07)", marginBottom:10 };
  const PH  = { background:"#0F1E3C", padding:"14px 16px" };

  // ── Pantalla de carga ──
  if (loading) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F0F4F8",gap:16}}>
      <Logo size={52}/>
      <div style={{fontSize:20,fontWeight:900,color:"#0F1E3C"}}>Houscare</div>
      <div style={{width:36,height:36,border:"4px solid #E2E8F0",borderTopColor:"#1D44AA",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <div style={{fontSize:13,color:"#64748B"}}>Cargando datos…</div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  // ── Login / Registro admin (no aplica a portales — esos entran directo sin sesión) ──
  if (!portal && !usuario) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F0F4F8",padding:24}}>

      <div style={{fontSize:20,fontWeight:900,color:"#0F1E3C",margin:"12px 0 24px"}}>Houscare</div>

      {!showRegister ? (
        <div style={{background:"#fff",borderRadius:16,padding:24,width:"100%",maxWidth:340,boxShadow:"0 1px 6px rgba(0,0,0,.07)",boxSizing:"border-box"}}>
          <div style={{marginBottom:14}}>
            <label style={LBL}>Email</label>
            <input type="email" autoComplete="username" value={loginForm.email} onChange={e=>setLoginForm(f=>({...f,email:e.target.value}))} style={INP}/>
          </div>
          <div style={{marginBottom:14}}>
            <label style={LBL}>Contraseña</label>
            <input type="password" autoComplete="current-password" value={loginForm.password} onChange={e=>setLoginForm(f=>({...f,password:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&doLogin()} style={INP}/>
          </div>
          {loginErr && <div style={{color:"#991B1B",fontSize:12,marginBottom:12,fontWeight:600}}>{loginErr}</div>}
          <button onClick={doLogin} disabled={loginBusy} style={{...BB,opacity:loginBusy?.7:1}}>{loginBusy?"Ingresando…":"Ingresar"}</button>
          <button onClick={()=>{setShowRegister(true);setLoginErr("");}} style={{...BG,marginTop:10,background:"transparent",color:"#1D44AA"}}>Crear cuenta nueva</button>
        </div>
      ) : (
        <div style={{background:"#fff",borderRadius:16,padding:24,width:"100%",maxWidth:340,boxShadow:"0 1px 6px rgba(0,0,0,.07)",boxSizing:"border-box"}}>
          <div style={{fontSize:14,fontWeight:800,color:"#0F1E3C",marginBottom:14}}>Crear cuenta de tu inmobiliaria</div>

            <label style={LBL}>Nombre de la inmobiliaria</label>

          <div style={{marginBottom:12}}>
            <label style={LBL}>Tu nombre</label>
            <input type="text" value={registerForm.nombre} onChange={e=>setRegisterForm(f=>({...f,nombre:e.target.value}))} style={INP}/>
          </div>
          <div style={{marginBottom:12}}>
            <label style={LBL}>Email</label>
            <input type="email" autoComplete="username" value={registerForm.email} onChange={e=>setRegisterForm(f=>({...f,email:e.target.value}))} style={INP}/>

          <div style={{marginBottom:14}}>
            <label style={LBL}>Contraseña (mínimo 8 caracteres)</label>

        </div>

    </div>

  if (portal?.type === "inq")       return <PortalInqToken  token={portal.token} fromAdmin={portal.fromAdmin} onBack={backToPortales}/>;
  if (portal?.type === "prov")      return <PortalProvToken token={portal.token} fromAdmin={portal.fromAdmin} onBack={backToPortales}/>;
  if (portal?.type === "own")       return <PortalOwnToken  token={portal.token} fromAdmin={portal.fromAdmin} onBack={backToPortales}/>;
  if (portal?.type === "provh")     return <PortalProvHome  token={portal.token} fromAdmin={portal.fromAdmin} onBack={backToPortales}/>;
  if (portal?.type === "ownh")      return <PortalOwnHome   token={portal.token} fromAdmin={portal.fromAdmin} onBack={backToPortales}/>;

  // ════════════════════════════════════════════════════════

  return (

      {toast && (
        <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#0F1E3C",color:"#fff",padding:"10px 20px",borderRadius:12,fontSize:13,fontWeight:700,zIndex:9999,whiteSpace:"nowrap",boxShadow:"0 4px 16px rgba(0,0,0,.25)"}}>
          {toast}
        </div>
      )}

      {/* Header */}
      <div style={{background:"#0F1E3C",padding:"14px 16px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Logo/>
            <div>
              <div style={{color:"#fff",fontWeight:800,fontSize:15,lineHeight:1.2}}>{usuario?.nombre || "Houscare"}</div>
              <div style={{color:"#94A3B8",fontSize:11}}>{usuario?.org_nombre || ""}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setShowChangePass(true);setChangePassErr("");}} style={{background:"rgba(255,255,255,.15)",color:"#fff",border:"none",borderRadius:10,padding:"8px 10px",fontWeight:700,fontSize:14,cursor:"pointer"}} title="Cambiar contraseña">🔑</button>
            <button onClick={()=>{ if(confirm("¿Cerrar sesión?")) doLogout(); }} style={{background:"rgba(255,255,255,.15)",color:"#fff",border:"none",borderRadius:10,padding:"8px 10px",fontWeight:700,fontSize:14,cursor:"pointer"}} title={`Salir (${usuario?.nombre||""})`}>🚪</button>
            <button onClick={refresh} style={{background:"rgba(255,255,255,.15)",color:"#fff",border:"none",borderRadius:10,padding:"8px 10px",fontWeight:700,fontSize:16,cursor:"pointer"}} title="Actualizar datos">🔄</button>
            <button onClick={()=>{
              if(tab==="proveedores"){setProvForm(EPROVF);setShowProvForm(true);}
              else if(tab==="propiedades"&&propTab==="props"){setPropForm(EPROPF);setEditPropId(null);setShowPropForm(true);}
              else if(tab==="propiedades"&&propTab==="owners"){setOwnerForm(EOWNF);setEditOwnerId(null);setShowOwnerForm(true);}
              else{setForm(EF);setEditId(null);setShowForm(true);}
            }} style={{background:"#1D44AA",color:"#fff",border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:13,cursor:"pointer"}}>+ Nuevo</button>
          </div>
        </div>
        <div style={{display:"flex",gap:2,marginTop:12}}>
          {NAV.map(n => (
            <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,background:tab===n.id?"#fff":"transparent",color:tab===n.id?"#0F1E3C":"rgba(255,255,255,.6)",border:"none",borderRadius:"8px 8px 0 0",padding:"8px 2px",fontWeight:tab===n.id?800:600,fontSize:11,cursor:"pointer"}}>
              {n.l}
            </button>
          ))}
        </div>

        {/* Sub-nav + búsqueda por pestaña (sesión 8, 12/08/2026): antes vivían
            adentro del contenido de cada pestaña y se perdían al scrollear —
            ahora quedan acá, dentro del mismo header sticky, siempre visibles. */}
        {tab === "reclamos" && (
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <input placeholder="🔍 Buscar por ID, propiedad, inquilino..." value={busqueda} onChange={e=>setBusqueda(e.target.value)} style={{...INP,flex:1}}/>
            <button onClick={()=>setShowFil(f=>!f)} style={{background:showFil?"#1D44AA":"#fff",color:showFil?"#fff":"#475569",border:"1.5px solid #E2E8F0",borderRadius:10,padding:"0 14px",fontWeight:700,fontSize:13,cursor:"pointer",flexShrink:0}}>⚙️ Filtros</button>
          </div>
        )}
        {tab === "proveedores" && (
          <div style={{display:"flex",gap:2,marginTop:12}}>
            {[["todos","Todos"],["Inactivo","Inactivos"],["Suspendido","Suspendidos"]].map(([id,l])=>{
              const count = id==="todos"?proveedores.length:proveedores.filter(p=>(p.estado||"Activo")===id).length;
              return <button key={id} onClick={()=>setProvTab(id)} style={{flex:1,background:provTab===id?"#fff":"transparent",color:provTab===id?"#0F1E3C":"rgba(255,255,255,.6)",border:"none",borderRadius:"8px 8px 0 0",padding:"8px 4px",fontWeight:provTab===id?800:600,fontSize:10,cursor:"pointer"}}>{l} ({count})</button>;
            })}
          </div>
        )}
        {tab === "propiedades" && (
          <>
            <div style={{display:"flex",gap:2,marginTop:12}}>
              {[["props","🏠 Propiedades"],["owners","👤 Propietarios"]].map(([id,l])=>(
                <button key={id} onClick={()=>setPropTab(id)} style={{flex:1,background:propTab===id?"#fff":"transparent",color:propTab===id?"#0F1E3C":"rgba(255,255,255,.6)",border:"none",borderRadius:"8px 8px 0 0",padding:"8px 4px",fontWeight:propTab===id?800:600,fontSize:11,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
            <input placeholder="🔍 Buscar..." value={propBusq} onChange={e=>setPropBusq(e.target.value)} style={{...INP,marginTop:10}}/>
          </>
        )}
        {tab === "portales" && (
          // Sesión 8 (12/08/2026): Portales quedó sólo para Inquilinos —
          // proveedores y propietarios se unificaron en sus propias pestañas

          <input placeholder="🔍 Buscar propiedad o inquilino..." value={portalBusq} onChange={e=>setPortalBusq(e.target.value)} style={{...INP,marginTop:12}}/>
        )}
      </div>

      {/* ── INICIO ── */}
      {tab === "inicio" && (
        <div style={{paddingBottom:24}}>
          {st.altas.length > 0  && <div style={{background:"#FEE2E2",borderLeft:"4px solid #EF4444",padding:"10px 16px",marginBottom:5,display:"flex",alignItems:"center",gap:8}}><span>🔴</span><span style={{fontSize:13,color:"#991B1B",fontWeight:600}}><b>{st.altas.length}</b> reclamo{st.altas.length>1?"s":""} de prioridad <b>Alta</b> sin cerrar</span></div>}
          {st.stale.length > 0  && <div style={{background:"#FEF3C7",borderLeft:"4px solid #F59E0B",padding:"10px 16px",marginBottom:5,display:"flex",alignItems:"center",gap:8}}><span>⚠️</span><span style={{fontSize:13,color:"#92400E",fontWeight:600}}><b>{st.stale.length}</b> reclamo{st.stale.length>1?"s":""} sin actualizar hace <b>+7 días</b></span></div>}
          {st.aprob > 0         && <div style={{background:"#EFF6FF",borderLeft:"4px solid #3B82F6",padding:"10px 16px",marginBottom:12,display:"flex",alignItems:"center",gap:8}}><span>⏳</span><span style={{fontSize:13,color:"#1D44AA",fontWeight:600}}><b>{st.aprob}</b> reclamo{st.aprob>1?"s":""} esperando aprobación del propietario</span></div>}
          <div style={{padding:"0 16px"}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
              {[{l:"Total",v:st.total,c:"#3B82F6"},{l:"Pendientes",v:st.pend,c:"#F59E0B"},{l:"En proceso",v:st.proc,c:"#10B981"},{l:"Alta prio",v:st.alta,c:"#EF4444"},{l:"Atrasados",v:st.atras,c:"#F97316"},{l:"Cerrados",v:st.cerr,c:"#6B7280"}].map(k => (
                <div key={k.l} style={{background:"#fff",borderRadius:12,padding:"12px 8px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
                  <div style={{fontSize:22,fontWeight:900,color:k.c,lineHeight:1.1}}>{k.v}</div>
                  <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginTop:2}}>{k.l}</div>
                </div>
              ))}
            </div>
            <div style={{...CARD,marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>💰 Costo total (estimado + real)</div>
              <div style={{fontSize:28,fontWeight:900,color:"#0F1E3C"}}>${st.costo.toLocaleString("es-AR")}</div>
            </div>
            <div style={{background:"#fff",borderRadius:14,overflow:"hidden",boxShadow:"0 1px 6px rgba(0,0,0,.07)"}}>
              <div style={{padding:"12px 16px",borderBottom:"1px solid #F1F5F9",fontSize:12,fontWeight:800,color:"#94A3B8",letterSpacing:1.2,textTransform:"uppercase"}}>Acciones rápidas</div>
              {[
                {i:"➕", l:"Nuevo reclamo",        a:()=>{setForm(EF);setEditId(null);setShowForm(true);}},
                {i:"📊", l:"Exportar a Excel (CSV)",a:exportCSV},
                {i:"📋", l:"Ver todos los reclamos",a:()=>setTab("reclamos")},
                {i:"🔧", l:"Proveedores",           a:()=>setTab("proveedores")},
                {i:"🔗", l:"Portales de acceso",    a:()=>setTab("portales")},
              ].map((a,i,arr) => (
                <button key={a.l} onClick={a.a} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",width:"100%",background:"none",border:"none",borderBottom:i<arr.length-1?"1px solid #F8FAFC":"none",cursor:"pointer",textAlign:"left"}}>
                  <span style={{fontSize:18,width:28,flexShrink:0}}>{a.i}</span>
                  <span style={{fontSize:14,fontWeight:600,color:"#1a2035"}}>{a.l}</span>

          {showFil && (
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <select value={fEst}  onChange={e=>setFEst(e.target.value)}  style={{...INP,flex:1}}>{["Todos",...ESTADOS].map(o=><option key={o}>{o}</option>)}</select>
              <select value={fPrio} onChange={e=>setFPrio(e.target.value)} style={{...INP,flex:1}}>{["Todos",...PRIORIDADES].map(o=><option key={o}>{o}</option>)}</select>
            </div>
          )}
          <div style={{fontSize:12,color:"#94A3B8",fontWeight:600,marginBottom:10}}>{fils.length} resultado{fils.length!==1?"s":""}</div>
          {fils.map(r => (
            <div key={r.id} onClick={()=>setDetId(r.id)} style={{...CARD,cursor:"pointer",borderLeft:`4px solid ${PC[r.prioridad]?.d}`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{fontSize:11,fontWeight:800,color:"#1D44AA",background:"#EFF6FF",padding:"2px 8px",borderRadius:6}}>{r.id}</span>
                  <span style={{fontSize:11,color:"#94A3B8"}}>{daysDiff(r.fecha)}d</span>

            })()}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
              <div><label style={LBL}>Costo estimado ($)</label><input type="number" placeholder="0" value={form.costoEst}  onChange={e=>setForm(p=>({...p,costoEst:e.target.value}))}  style={INP}/></div>
              <div><label style={LBL}>Costo real ($)</label>    <input type="number" placeholder="0" value={form.costoReal} onChange={e=>setForm(p=>({...p,costoReal:e.target.value}))} style={INP}/></div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={LBL}>¿Quién paga?</label>
              <select value={form.quienPaga} onChange={e=>setForm(p=>({...p,quienPaga:e.target.value}))} style={INP}>{QUIEN_PAGA.map(o=><option key={o}>{o}</option>)}</select>
              {form.quienPaga === "Por Porcentaje" && (
                <div style={{background:"#F8FAFC",borderRadius:10,padding:"12px",marginTop:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#64748B",textTransform:"uppercase",letterSpacing:.8,marginBottom:10}}>Distribución del costo</div>
                  {[["Inquilino","pctInq"],["Propietario","pctProp"],["Inmobiliaria","pctInmob"]].map(([l,k]) => (
                    <div key={k} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <span style={{fontSize:13,color:"#475569",width:88,flexShrink:0}}>{l}</span>
                      <input type="number" min="0" max="100" value={form[k]} onChange={e=>setForm(p=>({...p,[k]:Number(e.target.value)}))} style={{...INP,width:64,padding:"6px 8px",fontSize:13}}/>
                      <span style={{fontSize:13,color:"#64748B"}}>%</span>
                      {(Number(form.costoEst)||0) > 0 && <span style={{fontSize:12,color:"#64748B",marginLeft:"auto"}}>{fmt$(Number(form.costoEst)*(form[k]||0)/100)}</span>}
                    </div>
                  ))}
                  <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,borderTop:"1px solid #E2E8F0"}}>
                    <span style={{fontSize:13,fontWeight:700}}>Total</span>
                    <div style={{textAlign:"right"}}>
                    <span style={{fontSize:13,fontWeight:700,color:pSum(form)===100?"#059669":"#EF4444"}}>{pSum(form)}%{pSum(form)!==100?" ⚠️ debe sumar 100%":" ✓"}</span>
                    {Number(form.costoEst)>0&&<div style={{fontSize:11,color:pSum(form)===100?"#059669":"#EF4444",marginTop:2}}>{fmt$(Number(form.costoEst)*pSum(form)/100)}{pSum(form)===100?" = estimado":" ≠ "+fmt$(Number(form.costoEst))+" estimado"}</div>}
                  </div>
                  </div>
                </div>
              )}
            </div>
            <div style={{marginBottom:14}}><label style={LBL}>Descripción *</label><textarea placeholder="Describí el problema..." value={form.descripcion} onChange={e=>setForm(p=>({...p,descripcion:e.target.value}))} style={{...INP,height:88,resize:"none"}}/></div>
            <div style={{marginBottom:14}}><label style={LBL}>Notas internas</label><textarea placeholder="Observaciones para el equipo..." value={form.notas} onChange={e=>setForm(p=>({...p,notas:e.target.value}))} style={{...INP,height:64,resize:"none"}}/></div>
            <div style={{marginBottom:24}}>
              <label style={LBL}>📷 Fotos</label>
              <input type="file" id="admin-file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{addFotosF(setForm,"Admin",e.target.files);e.target.value="";}}/>
              <label htmlFor="admin-file" style={{display:"block",background:"#F8FAFC",border:"1.5px dashed #CBD5E1",borderRadius:10,padding:"12px",cursor:"pointer",color:"#64748B",fontWeight:600,fontSize:13,textAlign:"center",boxSizing:"border-box"}}>📷 Agregar fotos</label>
              {form.fotos?.length > 0 && (
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:8}}>
                  {form.fotos.map((f,i) => (
                    <div key={i} style={{position:"relative"}}>
                      <img src={f.dataUrl} alt="" style={{width:"100%",height:80,objectFit:"cover",borderRadius:8,border:"1.5px solid #E2E8F0"}}/>
                      <button onClick={()=>setForm(fr=>({...fr,fotos:fr.fotos.filter((_,j)=>j!==i)}))} style={{position:"absolute",top:3,right:3,background:"rgba(0,0,0,.65)",color:"#fff",border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",fontSize:12}}>×</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <button onClick={submit} style={BB}>{editId?"Guardar cambios":"Crear reclamo"}</button>
            <button onClick={()=>setShowForm(false)} style={{...BG,marginTop:10}}>Cancelar</button>
          </div>
        </div>
      )}

      {/* ── MODAL: DETALLE RECLAMO ── */}
      {detId && det && (
        <div onClick={()=>setDetId(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"20px 20px 36px",width:"100%",maxHeight:"92vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div>
                <span style={{fontSize:11,fontWeight:800,color:"#1D44AA",background:"#EFF6FF",padding:"3px 10px",borderRadius:6}}>{det.id}</span>
                <h2 style={{margin:"8px 0 2px",fontSize:15,fontWeight:900,color:"#0F1E3C"}}>{det.propiedad}</h2>
                <div style={{fontSize:13,color:"#64748B"}}>{det.inquilino} · {det.sector}</div>
              </div>
              <button onClick={()=>setDetId(null)} style={{background:"#F1F5F9",border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:18,color:"#64748B"}}>×</button>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
              <Badge label={det.estado}/><Badge label={det.prioridad} type="prioridad"/>
              {det.aprobacion==="pendiente"  && <span style={{fontSize:11,background:"#FEF3C7",color:"#92400E",fontWeight:700,padding:"3px 9px",borderRadius:20}}>⏳ Pendiente aprobación</span>}
              {det.aprobacion==="aprobada"   && <span style={{fontSize:11,background:"#D1FAE5",color:"#065F46",fontWeight:700,padding:"3px 9px",borderRadius:20}}>✅ Aprobado</span>}
              {det.aprobacion==="rechazada"  && <span style={{fontSize:11,background:"#FEE2E2",color:"#991B1B",fontWeight:700,padding:"3px 9px",borderRadius:20}}>❌ Rechazado</span>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
              {[["Fecha",fmtDate(det.fecha)],["Proveedor",det.proveedor||"Sin asignar"],["Costo estimado",fmt$(det.costoEst)],["Costo real",det.costoReal?fmt$(det.costoReal):"—"],["¿Quién paga?",det.quienPaga],["Email",det.email||"—"]].map(([l,v]) => (
                <div key={l} style={{background:"#F8FAFC",borderRadius:10,padding:"10px 12px"}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8,marginBottom:2}}>{l}</div>
                  <div style={{fontSize:13,fontWeight:600,color:"#0F1E3C",wordBreak:"break-word"}}>{v}</div>
                </div>
              ))}
            </div>
            {det.quienPaga === "Por Porcentaje" && (
              <div style={{background:"#F8FAFC",borderRadius:10,padding:"10px 12px",marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8,marginBottom:6}}>Distribución del costo</div>
                <PctBreakdown r={det}/>
              </div>
            )}
            <div style={{background:"#F8FAFC",borderRadius:10,padding:12,marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8,marginBottom:4}}>Descripción</div>
              <p style={{margin:0,fontSize:13,lineHeight:1.6,color:"#475569"}}>{det.descripcion}</p>
            </div>
            {det.notas && (
              <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:12,marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:700,color:"#92400E",textTransform:"uppercase",letterSpacing:.8,marginBottom:4}}>📝 Notas internas</div>
                <p style={{margin:0,fontSize:13,color:"#78350F"}}>{det.notas}</p>
              </div>
            )}
            <div style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:.8}}>📷 Fotos ({det.fotos?.length||0})</div>
                {det.estado !== "Cerrado" && (
                  <>
                    <input type="file" id={`det-file-${det.id}`} accept="image/*" multiple style={{display:"none"}} onChange={e=>{addFotosAdmin(det.id,"Admin",e.target.files);e.target.value="";showToast("📷 Foto agregada");}}/>
                    <label htmlFor={`det-file-${det.id}`} style={{background:"#EFF6FF",color:"#1D44AA",borderRadius:8,padding:"5px 12px",fontWeight:700,fontSize:12,cursor:"pointer"}}>+ Agregar</label>
                  </>
                )}
              </div>
              {det.fotos?.length > 0 ? <Galeria fotos={det.fotos}/> : <div style={{textAlign:"center",padding:"14px 0",color:"#94A3B8",fontSize:13}}>Sin fotos adjuntas</div>}
            </div>
            <ChatPanel reclamo={det} autor="Admin" onSend={sendMsgAdmin}/>
            {det.estado !== "Cerrado" && det.costoEst > 0 && det.aprobacion === null && (
              <button onClick={()=>solAprob(det.id)} style={{...BG,marginBottom:10,color:"#1D44AA"}}>📩 Solicitar aprobación del propietario</button>
            )}
            {det.estado !== "Cerrado" ? (
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>abrirEdit(det)} style={{...BG,flex:1}}>✏️ Editar</button>
                <button onClick={()=>cerrar(det.id)} style={{...BB,flex:1,background:"#059669"}}>✅ Cerrar reclamo</button>
              </div>
            ) : (
              <div style={{textAlign:"center",color:"#059669",fontSize:14,fontWeight:600}}>✅ Reclamo cerrado el {fmtDate(det.ultimaAct)}</div>
            )}
          </div>
        </div>
      )}

      {/* ── MODAL: CAMBIAR CONTRASEÑA (sesión 8, 11/08/2026) ── */}
      {showChangePass && (
        <div onClick={()=>setShowChangePass(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,padding:24,width:"100%",maxWidth:360,boxSizing:"border-box"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:900,color:"#0F1E3C"}}>🔑 Cambiar contraseña</h3>
              <button onClick={()=>setShowChangePass(false)} style={{background:"#F1F5F9",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:16,color:"#64748B"}}>x</button>
            </div>
            <div style={{marginBottom:12}}>
              <label style={LBL}>Contraseña actual</label>
              <input type="password" autoComplete="current-password" value={changePassForm.actual} onChange={e=>setChangePassForm(f=>({...f,actual:e.target.value}))} style={INP}/>
            </div>
            <div style={{marginBottom:12}}>
              <label style={LBL}>Contraseña nueva (mínimo 8 caracteres)</label>
              <input type="password" autoComplete="new-password" value={changePassForm.nueva} onChange={e=>setChangePassForm(f=>({...f,nueva:e.target.value}))} style={INP}/>
            </div>
            <div style={{marginBottom:14}}>
              <label style={LBL}>Repetir contraseña nueva</label>
              <input type="password" autoComplete="new-password" value={changePassForm.nueva2} onChange={e=>setChangePassForm(f=>({...f,nueva2:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&doCambiarPassword()} style={INP}/>
            </div>
            {changePassErr && <div style={{color:"#991B1B",fontSize:12,marginBottom:12,fontWeight:600}}>{changePassErr}</div>}
            <button onClick={doCambiarPassword} disabled={changePassBusy} style={{...BB,opacity:changePassBusy?.7:1}}>{changePassBusy?"Guardando…":"Guardar nueva contraseña"}</button>
          </div>
        </div>
      )}

      {/* ── MODAL: CALIFICACIÓN DE PROVEEDOR ── */}
      {ratingModal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{background:"#fff",borderRadius:20,padding:24,width:"100%",maxWidth:360}}>
            <div style={{textAlign:"center",marginBottom:16}}>
              <div style={{fontSize:36,marginBottom:8}}>⭐</div>
              <h3 style={{margin:"0 0 4px",fontSize:16,fontWeight:900,color:"#0F1E3C"}}>Calificá al proveedor</h3>
              <p style={{margin:0,fontSize:13,color:"#64748B"}}>{ratingModal.provNombre}</p>
            </div>
            <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:20}}>
              {[1,2,3,4,5].map(n=>(
                <button key={n} onClick={()=>setRatingModal(m=>({...m,val:n}))}
                  style={{fontSize:32,background:"none",border:"none",cursor:"pointer",
                    color:n<=(ratingModal.val||0)?"#F59E0B":"#E2E8F0",transition:"color .15s"}}>★</button>
              ))}
            </div>
            <div style={{fontSize:12,color:"#94A3B8",textAlign:"center",marginBottom:12}}>
              {ratingModal.val===0?"Tocá las estrellas para calificar":["","⭐ Muy malo","⭐⭐ Regular","⭐⭐⭐ Bueno","⭐⭐⭐⭐ Muy bueno","⭐⭐⭐⭐⭐ Excelente"][ratingModal.val]}
            </div>
            <textarea value={ratingComent} onChange={e=>setRatingComent(e.target.value)} placeholder="Comentario sobre el trabajo (opcional)..." style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid #E2E8F0",fontSize:13,resize:"none",height:72,fontFamily:"inherit",boxSizing:"border-box",marginBottom:12,outline:"none"}}/>
            <button onClick={()=>cerrar(ratingModal.id, ratingModal.val||null, ratingComent)} style={{...BB,marginBottom:8}}>
              {ratingModal.val>0?"✅ Cerrar y calificar":"Cerrar sin calificar"}
            </button>
            <button onClick={()=>{setRatingModal(null);setRatingComent('');}} style={BG}>Cancelar</button>
          </div>
        </div>
      )}

      {/* ── MODAL: NUEVO PROVEEDOR ── */}
      {showProvForm && (
        <div onClick={()=>setShowProvForm(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"20px 20px 36px",width:"100%",maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h2 style={{margin:0,fontSize:17,fontWeight:900,color:"#0F1E3C"}}>Nuevo proveedor</h2>
              <button onClick={()=>setShowProvForm(false)} style={{background:"#F1F5F9",border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:18,color:"#64748B"}}>x</button>
            </div>
            <div style={{marginBottom:14}}><label style={LBL}>Nombre / Empresa *</label><input placeholder="Ej: Garcia Plomeria" value={provForm.nombre} onChange={e=>setProvForm(p=>({...p,nombre:e.target.value}))} style={INP}/></div>
            <div style={{marginBottom:14}}><label style={LBL}>Especialidad *</label><select value={provForm.rubro} onChange={e=>setProvForm(p=>({...p,rubro:e.target.value}))} style={INP}><option value="">selecciona</option>{SECTORES.map(o=><option key={o}>{o}</option>)}</select></div>
            <div style={{marginBottom:14}}><label style={LBL}>Telefono</label><input placeholder="341-555-0000" value={provForm.tel} onChange={e=>setProvForm(p=>({...p,tel:e.target.value}))} style={INP}/></div>
            <div style={{marginBottom:14}}><label style={LBL}>Email</label><input type="email" placeholder="proveedor@mail.com" value={provForm.email} onChange={e=>setProvForm(p=>({...p,email:e.target.value}))} style={INP}/></div>
            <div style={{marginBottom:14}}><label style={LBL}>Zona</label><input placeholder="Ej: Rosario Norte" value={provForm.zona} onChange={e=>setProvForm(p=>({...p,zona:e.target.value}))} style={INP}/></div>
            <div style={{marginBottom:14}}><label style={LBL}>Estado</label><select value={provForm.estado||"Activo"} onChange={e=>setProvForm(p=>({...p,estado:e.target.value}))} style={INP}>{ESTADOS_PROV.map(o=><option key={o}>{o}</option>)}</select></div>
            <div style={{marginBottom:24}}><label style={LBL}>Notas</label><textarea placeholder="Observaciones, horarios, referencias..." value={provForm.notas} onChange={e=>setProvForm(p=>({...p,notas:e.target.value}))} style={{...INP,height:64,resize:"none"}}/></div>
            <button onClick={addProv} style={BB}>Guardar proveedor</button>
            <button onClick={()=>setShowProvForm(false)} style={{...BG,marginTop:10}}>Cancelar</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
